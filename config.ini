# ==============================================================================
# إعدادات الاتصال بقاعدة بيانات نظام NetworkFaults
# ==============================================================================
# ملاحظات:
# 1. إذا كان البرنامج يعمل على نفس جهاز السيرفر، اترك Server = localhost
# 2. إذا كان البرنامج يعمل على جهاز عميل في الشبكة، اكتب عنوان الـ IP للسيرفر
#    مثال: Server = 192.168.1.100 أو Server = 192.168.1.100,1433
# 3. للاتصال عبر الشبكة المحلية بين أجهزة مختلفة، يجب تفعيل UseSQLAuth = true
#    وكتابة اسم المستخدم وكلمة المرور الخاصة بـ SQL Server.
# ==============================================================================

[Database]
; عنوان خادم SQL Server (localhost أو IP السيرفر مثل 192.168.1.100)
Server = localhost

; اسم قاعدة البيانات
Database = NetworkFaults

; اسم مشغل الـ ODBC (الافتراضي Driver 18 أو Driver 17)
Driver = ODBC Driver 18 for SQL Server

; هل تستخدم مصادقة SQL Server (true) أم مصادقة الويندوز الحالية (false)؟
; هام: عند تشغيل البرنامج من جهاز عميل عبر الشبكة يجب ضبطها على true
UseSQLAuth = false

; اسم مستخدم قاعدة البيانات (يُستخدم فقط إذا كان UseSQLAuth = true)
Username = NetworkFaults_App

; كلمة مرور مستخدم قاعدة البيانات (تُستخدم فقط إذا كان UseSQLAuth = true)
Password = P@ssw0rd_Secure_2026!

; قبول شهادة السيرفر تلقائياً وتفعيل خيارات التشفير المرنة (مهم جداً مع Driver 18)
TrustServerCertificate = yes
Encrypt = Optional

; مهلة محاولة الاتصال بالثواني قبل إظهار خطأ انتهاء المهلة
Timeout = 10
